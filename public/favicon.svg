<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ultra-vibrant Studio Gradient for maximum contrast in light & dark browser tabs -->
    <linearGradient id="vocalKeyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Pitch Correction Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- 
    Pure transparent background and contour.
    No outer border, no background rectangle.
    The icon geometry occupies the full available bounding box.
  -->
  <g id="vocal-autotune-icon">
    <!-- Top Double-Beam of the Eighth Notes -->
    <!-- Primary Upper Cross-Beam -->
    <polygon
      points="174,18 492,96 492,166 174,88"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Secondary Lower AutoTune Beam / Groove -->
    <polygon
      points="174,116 492,194 492,238 174,160"
      fill="url(#vocalKeyGrad)"
      opacity="0.92"
    />

    <!-- Left Note Stem -->
    <rect
      x="174"
      y="24"
      width="54"
      height="386"
      rx="6"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Right Note Stem -->
    <rect
      x="438"
      y="102"
      width="54"
      height="230"
      rx="6"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Left Note Head (Resonant tilted musical ellipse) -->
    <ellipse
      cx="134"
      cy="416"
      rx="96"
      ry="66"
      transform="rotate(-26 134 416)"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Right Note Head (Resonant tilted musical ellipse) -->
    <ellipse
      cx="398"
      cy="338"
      rx="96"
      ry="66"
      transform="rotate(-26 398 338)"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Center Vocal Frequency Spectrum / AutoTune Pitch Quantizer Bars -->
    <!-- Bar 1 (Left spectrum band) -->
    <rect
      x="248"
      y="256"
      width="28"
      height="182"
      rx="14"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Bar 2 (Central peak fundamental f0 resonance band) -->
    <rect
      x="292"
      y="198"
      width="28"
      height="250"
      rx="14"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Bar 3 (Right harmonic band) -->
    <rect
      x="336"
      y="238"
      width="28"
      height="180"
      rx="14"
      fill="url(#vocalKeyGrad)"
    />

    <!-- Pitch Correction Precision Star (AutoTune Lock Spark) at Top-Left -->
    <path
      d="M 88 18
         C 88 56, 56 88, 18 88
         C 56 88, 88 120, 88 158
         C 88 120, 120 88, 158 88
         C 120 88, 88 56, 88 18 Z"
      fill="url(#sparkGrad)"
    />

    <!-- Secondary Micro Pitch Sparkle -->
    <path
      d="M 148 168
         C 148 186, 134 200, 116 200
         C 134 200, 148 214, 148 232
         C 148 214, 162 200, 180 200
         C 162 200, 148 186, 148 168 Z"
      fill="url(#sparkGrad)"
      opacity="0.85"
    />
  </g>
</svg>
